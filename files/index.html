<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaussures : commande par WhatsApp</title>
<meta name="description" content="Commandez votre paire de chaussures en ligne et recevez-la partout au Maroc. Commande simple via WhatsApp.">
<meta name="theme-color" content="#111111">
<meta property="og:type" content="product">
<meta property="og:title" content="Chaussures : commande par WhatsApp">
<meta property="og:description" content="Commandez en quelques secondes via WhatsApp. Livraison au Maroc.">
<meta property="og:image" content="images/photo-1.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#commande">Aller au formulaire de commande</a>
<header class="top">
  <strong id="brand"></strong>
  <a class="btn btn-sm" href="#commande">Commander</a>
</header>
<main>
  <section class="hero">
    <div class="hero-text">
      <h1 id="p-name"></h1>
      <p class="tagline" id="p-tagline"></p>
      <p class="price"><span id="p-price"></span> <s id="p-old" hidden></s></p>
      <div class="cta-row">
        <a class="btn" href="#commande">Commander maintenant</a>
        <button class="btn btn-ghost" id="share" type="button">Partager sur Facebook</button>
      </div>
    </div>
    <img id="hero-img" class="hero-img" alt="" width="800" height="800" fetchpriority="high">
  </section>

  <section class="wrap product" id="produit" aria-labelledby="t-prod">
    <div class="gallery">
      <img id="main-img" alt="" width="800" height="800">
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="info">
      <h2 id="t-prod">Le produit</h2>
      <p id="p-desc"></p>
      <ul class="features" id="p-features"></ul>
      <div id="color-box" hidden><h3>Couleur : <span id="color-name"></span></h3><div class="chips" id="colors"></div></div>
      <h3>Taille</h3>
      <div class="chips" id="sizes" role="group" aria-label="Choix de la taille"></div>
    </div>
  </section>

  <section class="band" aria-labelledby="t-liv">
    <div class="wrap">
      <h2 id="t-liv">Livraison au Maroc</h2>
      <div class="zones" id="zones"></div>
      <p id="cod" class="note"></p>
    </div>
  </section>

  <section class="wrap order" id="commande" aria-labelledby="t-cmd">
    <h2 id="t-cmd">Commander</h2>
    <form id="order-form" novalidate>
      <label>Nom complet<input name="name" autocomplete="name" required></label>
      <label>Téléphone<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="06 00 00 00 00" required></label>
      <label>Ville<select name="city" required></select></label>
      <label>Adresse de livraison<textarea name="address" rows="2" autocomplete="street-address" required></textarea></label>
      <label id="f-color-wrap" hidden>Couleur<select name="color"></select></label>
      <div class="two">
        <label>Taille<select name="size" id="f-size" required></select></label>
        <label>Quantité<input name="qty" type="number" min="1" max="10" value="1" required></label>
      </div>
      <p class="total" id="total" aria-live="polite"></p>
      <p class="error" id="error" role="alert"></p>
      <button class="btn btn-block" type="submit">Confirmer ma commande</button>
      <p class="note">Un message WhatsApp prérempli s'ouvrira : il suffit de l'envoyer au vendeur.</p>
    </form>
  </section>

  <section class="band dark" aria-labelledby="t-conf">
    <div class="wrap">
      <h2 id="t-conf">Contact et garanties</h2>
      <div class="reviews" id="reviews"></div>
      <p id="returns"></p>
      <p id="contact"></p>
    </div>
  </section>
</main>
<footer><small>&copy; <span id="year"></span> <span id="foot-brand"></span></small></footer>
<a class="wa-float" id="wa-float" target="_blank" rel="noopener" aria-label="Écrire au vendeur sur WhatsApp">
  <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path fill="#fff" d="M16 3a13 13 0 0 0-11 19.800L3 29l6.400-2A13 13 0 1 0 16 3zm0 23.700a10.700 10.700 0 0 1-5.500-1.500l-.4-.2-3.800 1.200 1.200-3.700-.3-.4A10.700 10.700 0 1 1 16 26.700zm5.900-8c-.3-.2-1.900-.9-2.200-1s-.5-.2-.7.200-.8 1-1 1.200-.4.200-.7 0a8.700 8.700 0 0 1-4.300-3.800c-.3-.6.300-.5.900-1.700.1-.2 0-.4 0-.5l-1-2.300c-.2-.6-.5-.5-.7-.5h-.6a1.200 1.200 0 0 0-.9.400 3.700 3.700 0 0 0-1.100 2.700 6.400 6.400 0 0 0 1.400 3.400 14.700 14.700 0 0 0 5.600 4.900c2.100.9 2.900 1 3.900.8a3.300 3.300 0 0 0 2.200-1.600 2.700 2.700 0 0 0 .2-1.600c-.1-.1-.3-.2-.6-.4z"/></svg>
</a>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
